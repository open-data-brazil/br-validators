name: Release

# Publish a GitHub Release when a version tag is pushed on main.
# Distribution is GitHub-only: every workspace package is attached as an `npm pack`
# tarball plus the embedded reference data (tar.gz + catalog.json + SHA256SUMS).
# No npm registry, no NPM_TOKEN, no OTP — see docs/BRANCHING.md.
#
# Install from a release:
#   npm install https://github.com/open-data-brazil/br-validators/releases/download/<tag>/br-validators-core-<version>.tgz

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: 'Existing git tag to release (e.g. v1.10.1-data.34)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to release (e.g. v1.10.1-data.34)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    # A PAT-pushed tag and a workflow_call for the same tag must not race.
    concurrency:
      group: release-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Resolve release tag
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          PRERELEASE=false
          if [[ "$VERSION" == *-alpha* || "$VERSION" == *-beta* || "$VERSION" == *-rc* ]]; then
            PRERELEASE=true
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.version.outputs.tag }}

      - name: Verify tag matches package versions
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for PKG in packages/br-validators apps/cli packages/br-validators-zod packages/br-validators-rhf packages/br-validators-express packages/br-validators-vue; do
            ACTUAL="$(jq -r .version "$PKG/package.json")"
            if [ "$ACTUAL" != "$VERSION" ]; then
              echo "Tag version $VERSION does not match $PKG/package.json ($ACTUAL)"
              exit 1
            fi
          done

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Quality gate
        run: pnpm verify

      - name: Build release assets (npm pack tarballs + reference data)
        run: |
          pnpm exec tsx scripts/build-release-artifacts.ts \
            --tag "${{ steps.version.outputs.tag }}" \
            --out dist/release \
            --notes dist/release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file dist/release-notes.md
            gh release upload "$TAG" dist/release/* --clobber
          elif [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            gh release create "$TAG" dist/release/* --title "$TAG" --notes-file dist/release-notes.md --verify-tag --prerelease
          else
            gh release create "$TAG" dist/release/* --title "$TAG" --notes-file dist/release-notes.md --verify-tag --latest
          fi

      - name: Release summary
        run: |
          {
            echo "### Release ${{ steps.version.outputs.tag }}"
            echo ""
            echo "Assets: $(find dist/release -maxdepth 1 -type f -printf '%f ' | sort)"
            echo ""
            echo '```bash'
            echo "npm install https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/br-validators-core-${{ steps.version.outputs.version }}.tgz"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
