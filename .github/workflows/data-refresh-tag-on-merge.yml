name: Data refresh tag on merge

# After a bot/data-release/* PR merges to main, push the version tag and publish the
# GitHub Release. A tag pushed with GITHUB_TOKEN does not trigger release.yml, so the
# release job below calls it directly in that case.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag-release:
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      call_release: ${{ steps.release_trigger.outputs.call_release }}
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'bot/data-release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.DATA_REFRESH_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./packages/br-validators/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push release tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }} — data refresh"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Sync developing
        if: steps.tag_check.outputs.exists == 'false'
        continue-on-error: true
        run: |
          git fetch origin developing
          git checkout developing
          git merge origin/main -m "chore: sync developing after data refresh release ${{ steps.version.outputs.tag }}"
          git push origin developing

      - name: Decide how release.yml runs
        id: release_trigger
        if: steps.tag_check.outputs.exists == 'false'
        env:
          HAS_PAT: ${{ secrets.DATA_REFRESH_GITHUB_TOKEN != '' }}
        run: |
          # A PAT-pushed tag triggers release.yml on its own; a GITHUB_TOKEN push does not.
          if [ "$HAS_PAT" = "true" ]; then
            echo "call_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "call_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: tag-release
    if: needs.tag-release.outputs.call_release == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag-release.outputs.tag }}
    permissions:
      contents: write
