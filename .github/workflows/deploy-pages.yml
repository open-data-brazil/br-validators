name: Deploy Playground to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/playground/**'
      - 'packages/br-validators/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: |
          pnpm --filter @br-validators/core build
          pnpm --filter @br-validators/cli build

      - name: Build Playground for GitHub Pages
        env:
          NEXT_PUBLIC_BASE_PATH: /br-validators
          NEXT_EXPORT: 'true'
        run: pnpm --filter @br-validators/playground build

      - name: Ensure .nojekyll exists
        run: touch apps/playground/out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/playground/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
