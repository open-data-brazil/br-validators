packages:
  - 'packages/*'
  - 'apps/*'
  - 'tests/integration/*'

# pnpm 11+ reads overrides from this file (package.json#pnpm is ignored).
# Keep until the affected transitive dependencies ship patched versions.
overrides:
  nanoid: ^3.3.18
  sharp: ^0.35.5
  postcss: ^8.5.18
  source-map-js: ^1.2.2
  vite@^5.0.0: ^6.4.3
